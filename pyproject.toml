[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-issues-list"
version = "0.1.0"
description = "Reviews a commercial lease against a firm's standard positions and drafts the issues list"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lease-review = "leasereview.cli:main"

[tool.setuptools]
packages = ["leasereview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_constructed.py" = ["E501"]
"leasereview/reviewer.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["leasereview"]
