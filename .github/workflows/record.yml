name: Record a live run

# Downloads the four public leases from SEC EDGAR, has Claude review them and the six
# constructed leases, saves every reply to recordings/, rebuilds the results and the demo page
# from the recording, and commits them. Needs the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download the EDGAR leases
        run: python -m leasereview.fetch
      - name: Live run (10 leases, one Claude review each)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          rm -f recordings/reviews.jsonl
          LEASE_LIVE=1 python scripts/run_all.py
          test "$(wc -l < recordings/reviews.jsonl)" -eq 10 || { echo "incomplete recording, not committing"; exit 1; }
      - name: Grade the recording and rebuild the demo page (replay only)
        run: |
          python scripts/run_all.py
          pytest -q || echo "::warning::the recorded run is below the bar; CI will fail until it is fixed"
          python scripts/build_demo.py
          python scripts/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings leases/edgar reports docs
          git commit -m "Record live run" || echo "nothing to commit"
          git push
